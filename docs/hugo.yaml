baseURL: "https://elcompa.github.io/aws-doctor/"
languageCode: "en-us"
title: "AWS Doctor"

module:
  imports:
    - path: github.com/imfing/hextra

params:
  navbar:
    displayLogo: true
    displaySearch: true
    width: wide
  page:
    width: wide
  footer:
    displayCopyright: true
  theme:
    default: system

markup:
  goldmark:
    renderer:
      unsafe: true

menu:
  main:
    - name: "Documentation"
      url: "/docs/"
      weight: 10
    - name: "GitHub"
      url: "https://github.com/elcompa/aws-doctor"
      weight: 20
      params:
        icon: github
